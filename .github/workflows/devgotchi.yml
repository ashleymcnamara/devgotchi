name: devgotchi

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: devgotchi
  cancel-in-progress: false

jobs:
  care:
    if: startsWith(github.event.issue.title, 'pet|') && github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Update Byte
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          CREATED=$(gh api "users/$LOGIN" --jq .created_at || echo "")
          python3 scripts/devgotchi.py act "$TITLE" "$LOGIN" "$CREATED" > "$RUNNER_TEMP/comment.md"

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A egg state.json README.md
          git diff --cached --quiet && exit 0
          git commit -q -m "byte: a caretaker stopped by"
          for i in 1 2 3; do git push -q && break; git pull -q --rebase; done

      - name: Reply, close, lock
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          sed -i "s/__SHA__/$(git rev-parse HEAD)/" "$RUNNER_TEMP/comment.md"
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
          gh issue lock "$NUM" --repo "$GITHUB_REPOSITORY" || true

  tidy:
    if: >-
      (!startsWith(github.event.issue.title, 'pet|') || github.event.issue.user.type != 'User')
      && github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close non-button issues
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "🥚 Byte only understands the buttons on the egg. Head back to [the egg](https://github.com/${GITHUB_REPOSITORY_OWNER}) to say hi!"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          gh issue lock "$NUM" --repo "$GITHUB_REPOSITORY" || true
