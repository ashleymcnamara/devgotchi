name: devgotchi

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: devgotchi
  cancel-in-progress: false

jobs:
  care:
    if: startsWith(github.event.issue.title, 'pet|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Byte
        env:
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: python3 scripts/devgotchi.py act "$TITLE" "$LOGIN" > "$RUNNER_TEMP/comment.md"

      - name: Save state
        env:
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A egg state.json README.md
          git diff --cached --quiet && exit 0
          git commit -m "byte: visit from @$LOGIN"
          for i in 1 2 3; do git push && break; git pull --rebase; done

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          sed -i "s/__SHA__/$(git rev-parse HEAD)/" "$RUNNER_TEMP/comment.md"
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
