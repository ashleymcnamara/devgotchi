name: devgotchi

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: devgotchi
  cancel-in-progress: false

jobs:
  care:
    if: startsWith(github.event.issue.title, 'pet|') && github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Let them know Byte heard
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUM/reactions" -f content=eyes --silent || true
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" \
                 -f body="🥚 *tap tap*… Byte is waking up. Your reply will appear right here in a few seconds." --jq .id || true)
          echo "ACK=$ID" >> "$GITHUB_ENV"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Update Byte
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          CREATED=$(gh api "users/$LOGIN" --jq .created_at || echo "")
          python3 scripts/devgotchi.py act "$TITLE" "$LOGIN" "$CREATED" > "$RUNNER_TEMP/comment.md"

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A egg docs state.json README.md
          git diff --cached --quiet && exit 0
          git commit -q -m "byte: a caretaker stopped by"
          for i in 1 2 3; do git push -q && break; git pull -q --rebase; done

      - name: Reply, close, lock
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          sed -i "s/__SHA__/$(git rev-parse HEAD)/g" "$RUNNER_TEMP/comment.md"
          if [ -n "$ACK" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ACK" -F body=@"$RUNNER_TEMP/comment.md" --silent \
              || gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          else
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
          gh issue lock "$NUM" --repo "$GITHUB_REPOSITORY" || true

      - name: Don't leave them hanging
        if: failure() && env.ACK != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ACK" --silent \
            -f body="😴 Byte dozed off before she could reply. Give it a minute and press the button again from [the egg](https://github.com/${GITHUB_REPOSITORY_OWNER})."

  tidy:
    if: >-
      (!startsWith(github.event.issue.title, 'pet|') || github.event.issue.user.type != 'User')
      && github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close non-button issues
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "🥚 Byte only understands the buttons on the egg. Head back to [the egg](https://github.com/${GITHUB_REPOSITORY_OWNER}) to say hi!"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          gh issue lock "$NUM" --repo "$GITHUB_REPOSITORY" || true
