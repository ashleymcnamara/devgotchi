name: devgotchi tick

# Byte gets a little hungrier and sleepier every 6 hours, so she needs the community.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devgotchi
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/devgotchi.py tick
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A egg docs state.json README.md
          git diff --cached --quiet && exit 0
          git commit -q -m "byte: time passes"
          for i in 1 2 3; do git push -q && break; git pull -q --rebase; done
