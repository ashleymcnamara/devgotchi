<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>devgotchi · raise Byte</title>
<meta name="description" content="Byte is a tiny pixel developer the GitHub community raises together. Pour her a coffee, send her to bed, or squash a bug.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="btn-coffee.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="device" id="device">
    <img class="shell" src="shell.png" alt="" width="680" height="828">
    <div class="lcd" id="lcd" role="img" aria-label="Byte's screen is loading"></div>
    <button class="btn" data-do="coffee" aria-label="Coffee: pour Byte a coffee"><img src="btn-coffee.png" alt=""></button>
    <button class="btn" data-do="nap" aria-label="Nap: send Byte to bed"><img src="btn-nap.png" alt=""></button>
    <button class="btn" data-do="debug" aria-label="Debug: help Byte squash a bug"><img src="btn-debug.png" alt=""></button>
  </div>
  <p class="msg" id="msg" aria-live="polite">Press a button to take care of Byte.</p>
  <p class="how">Each press opens a ready-made GitHub issue. Hit <b>Create</b> and Byte replies to you in about 30 seconds and updates for everyone. One press per person per hour.</p>
  <p class="who" id="who"></p>
  <p class="foot"><a href="https://github.com/ashleymcnamara/devgotchi">source</a> · <a href="https://github.com/ashleymcnamara">@ashleymcnamara</a></p>
</main>
<script src="app.js"></script>
</body>
</html>
